# 推送 v* tag（如 v1.0.0）时自动打包 Android APK（release）和游戏包，发布到 GitHub Releases。
#
# 游戏包订阅地址（App「订阅游戏」里填这个，永远指向最新一次发布）：
#   https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   ANDROID_KEYSTORE_BASE64    release.jks 的 base64
#   ANDROID_KEYSTORE_PASSWORD  keystore 和 key 的密码（两者相同）
#   ANDROID_KEY_ALIAS          key 的别名
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 打包游戏
        env:
          REPO: ${{ github.repository }}
        run: |
          # App 只比 manifest 的整数 version 大小判断有没有更新，跟 APK 的 versionCode 用同一套算法：
          # v1.2.3 -> 10203
          VERSION=${GITHUB_REF_NAME#v}
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          export CODE=$((MAJOR * 10000 + MINOR * 100 + ${PATCH:-0}))
          # 包内 manifest：version 换成本次的，server 指向 latest，本地导入的包也能订阅到后续更新
          export SERVER="https://github.com/$REPO/releases/latest/download/manifest.json"
          node -e '
            const fs = require("fs");
            const p = "public/manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.version = Number(process.env.CODE);
            m.server = process.env.SERVER;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
          '
          mkdir -p ../assets/service
          ./gen.sh
          mkdir -p ../dist
          cp dist.zip ../dist/typing.zip
          # 对外的 manifest = 包内 manifest + zip 地址 + sha1（zip 没法自含自己的 sha1）。
          # zip 写成带 tag 的绝对地址：订阅地址走的是 latest，如果写相对地址，
          # 拿 manifest 和下 zip 之间恰好发了新版，hash 就对不上了。
          export HASH=$(sha1sum dist.zip | cut -d' ' -f1)
          export ZIP="https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/typing.zip"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("public/manifest.json", "utf8"));
            m.zip = process.env.ZIP;
            m.hash = process.env.HASH;
            fs.writeFileSync("../dist/manifest.json", JSON.stringify(m, null, 2) + "\n");
          '
          cat ../dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - name: 准备签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # 没有正式签名就别发布：换签名会让用户无法覆盖升级
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - name: 打包 APK
        run: |
          # v1.2.3 -> versionName 1.2.3、versionCode 10203
          VERSION=${GITHUB_REF_NAME#v}
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$((MAJOR * 10000 + MINOR * 100 + ${PATCH:-0}))
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$VERSION" --build-number="$CODE"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/repeat-flutter-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    needs: [game, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          ## 下载

          | 文件 | 说明 |
          | --- | --- |
          | \`repeat-flutter-android.apk\` | 安卓手机 / 平板（64 位） |
          | \`typing.zip\` | 游戏包（打字、填空、切词、日语、跟读） |
          | \`manifest.json\` | 游戏包描述，订阅用 |

          ## 订阅游戏包

          在 App 的游戏列表里「订阅」，地址填：

          \`\`\`
          https://github.com/$REPO/releases/latest/download/manifest.json
          \`\`\`

          以后每次发版，App 里「检查更新」就能拿到新的游戏包，不用重新装 APK。
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
